<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <style>
        :root {
            --primary: #2d6a4f;
            --primary-dark: #1b4332;
            --bg: #f4f6f5;
            --text: #1a1a1a;
            --border: #d0d5d2;
            --error: #c0392b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }
        .contact-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 32px;
            width: 100%;
            max-width: 480px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
            color: var(--primary-dark);
        }
        .contact-card p.subtitle {
            margin: 0 0 24px;
            color: #555;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover:not(:disabled) {
            background: var(--primary-dark);
        }
        button[type="submit"]:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        #contact-status {
            margin-top: 14px;
            font-size: 0.9rem;
            text-align: center;
            min-height: 1.2em;
        }
        #contact-status.success { color: var(--primary-dark); }
        #contact-status.error { color: var(--error); }
    </style>
</head>
<body>

    <div class="contact-card">
        <h1>Contacto</h1>
        <p class="subtitle">Escribinos y te respondemos a la brevedad.</p>

        <form id="contact-form">
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
                <label for="title">Asunto</label>
                <input type="text" id="title" name="title" placeholder="Asunto del mensaje" required>
            </div>
            <div class="form-group">
                <label for="message">Mensaje</label>
                <textarea id="message" name="message" placeholder="Escribí tu mensaje..." required></textarea>
            </div>
            <button type="submit" id="contact-submit-btn">Enviar mensaje</button>
            <div id="contact-status"></div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        // ============================================================
        // EmailJS - config de la cuenta (dashboard.emailjs.com)
        // ============================================================
        const EMAILJS_PUBLIC_KEY = '4BmzgFE3a9MUz9DsL';
        const EMAILJS_SERVICE_ID = 'service_mwr8dz7';
        const EMAILJS_TEMPLATE_ID = 'template_p6qkpy5';

        emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

        const form = document.getElementById('contact-form');
        const submitBtn = document.getElementById('contact-submit-btn');
        const statusEl = document.getElementById('contact-status');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';
            statusEl.textContent = '';
            statusEl.className = '';

            emailjs.sendForm(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, form)
                .then(function () {
                    submitBtn.textContent = 'Enviado';
                    statusEl.textContent = '✅ Mensaje enviado correctamente. ¡Gracias por escribirnos!';
                    statusEl.className = 'success';
                    form.reset();
                    setTimeout(function () {
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Enviar mensaje';
                    }, 3000);
                })
                .catch(function (error) {
                    console.error('Error enviando el formulario de contacto:', error);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Enviar mensaje';
                    statusEl.textContent = '❌ No se pudo enviar el mensaje. Probá de nuevo.';
                    statusEl.className = 'error';
                    alert('No se pudo enviar el mensaje. Probá de nuevo o escribinos directamente a maximilianoempleo@gmail.com.');
                });
        });
    </script>
</body>
</html>
